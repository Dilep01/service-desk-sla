server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
spring:
  mail:
    host: ${MAIL_HOST:127.0.0.1}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 2000
      mail.smtp.timeout: 2000
      mail.smtp.writetimeout: 2000
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/servicedesk}
    username: ${DB_USER:servicedesk}
    password: ${DB_PASSWORD:local-development-only}
  flyway:
    user: ${MIGRATION_USER:${DB_USER:servicedesk}}
    password: ${MIGRATION_PASSWORD:${DB_PASSWORD:local-development-only}}
  jackson:
    serialization:
      write-dates-as-timestamps: false
